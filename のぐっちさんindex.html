                 */
                const getThirdMondayOfMonth = (year, month) => {
                    const d = new Date(year, month, 1);
                    const firstDayOfWeek = d.getDay(); // 0:日, 1:月, ...
                    // 月曜日の場合は1, 日曜日の場合は2, ...
                    const dateOfFirstMonday = 1 + (1 - firstDayOfWeek + 7) % 7;
                    return new Date(year, month, dateOfFirstMonday + 14);

                 * 今後の準備開始日の候補（第三月曜日）を3つ動的に計算する

                    today.setHours(0, 0, 0, 0); // 日付のみで比較するため時間をリセット

                    let currentDate = new Date(today.getFullYear(), today.getMonth(), 1);

                    while (dates.length < 3) {
                        const thirdMonday = getThirdMondayOfMonth(currentDate.getFullYear(), currentDate.getMonth());

                        if (thirdMonday >= today) {
                            dates.push(thirdMonday);
                        }
                        
                        // 次の月へ
                        currentDate.setMonth(currentDate.getMonth() + 1);
                    }
                    
                    const weekdays = ['(日)', '(月)', '(火)', '(水)', '(木)', '(金)', '(土)'];

                        const m = date.getMonth() + 1;
                        const d = date.getDate();
                        const w = weekdays[date.getDay()];

                            value: `${date.getFullYear()}/${m}/${d}`,
                            display: {
                                monthDay: `${m}/${d}`,
                                week: w
                            }
                        };
                    });
                };
