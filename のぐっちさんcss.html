<!-- @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

:root {
    --primary-color: #667eea;
    --primary-hover: #5a6fd8;
    --secondary-color: #764ba2;
    --accent-color: #f093fb;
    --success-color: #4ade80;
    --background-start: #667eea;
    --background-end: #764ba2;
    --form-background: rgba(255, 255, 255, 0.95);
    --text-primary: #1e293b;
    --text-secondary: #64748b;
    --border-color: rgba(255, 255, 255, 0.2);
    --input-background: rgba(255, 255, 255, 0.9);
    --shadow-light: 0 8px 32px rgba(102, 126, 234, 0.12);
    --shadow-medium: 0 16px 48px rgba(102, 126, 234, 0.18);
    --shadow-heavy: 0 24px 64px rgba(102, 126, 234, 0.25);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(135deg, var(--background-start) 0%, var(--background-end) 100%);
    min-height: 100vh;
    padding: 2rem 1rem;
    position: relative;
    overflow-x: hidden;
}

body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: 
        radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, rgba(120, 219, 255, 0.2) 0%, transparent 50%);
    pointer-events: none;
    z-index: 1;
}

#app {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
}

.container {
    background: var(--form-background);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 24px;
    box-shadow: var(--shadow-heavy);
    padding: 3rem;
    position: relative;
    overflow: hidden;
    animation: slideInUp 0.8s ease-out;
}

.container::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--primary-color), var(--accent-color), var(--secondary-color));
    border-radius: 24px 24px 0 0;
}

@keyframes slideInUp {
    from {
        opacity: 0;
        transform: translateY(60px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

h1 {
    text-align: center;
    background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 3rem;
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.2;
}

.success-message {
    text-align: center;
    padding: 3rem 2rem;
    animation: fadeIn 0.6s ease-out;
}

.success-message h2 {
    color: var(--success-color);
    margin-bottom: 1.5rem;
    font-size: 1.75rem;
    font-weight: 600;
}

.success-message p {
    color: var(--text-secondary);
    font-size: 1.1rem;
    line-height: 1.6;
}

@keyframes fadeIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
}

.form-group {
    margin-bottom: 2rem;
    position: relative;
}

label {
    display: block;
    margin-bottom: 0.75rem;
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--text-primary);
    letter-spacing: -0.01em;
}

input[type="text"],
textarea {
    width: 100%;
    padding: 1rem 1.25rem;
    background: var(--input-background);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(102, 126, 234, 0.2);
    border-radius: 16px;
    font-size: 1rem;
    font-family: inherit;
    color: var(--text-primary);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: var(--shadow-light);
}

input[type="text"]:focus,
textarea:focus {
    outline: none;
    border-color: var(--primary-color);
    box-shadow: 
        var(--shadow-medium),
        0 0 0 4px rgba(102, 126, 234, 0.1);
    transform: translateY(-2px);
    background: rgba(255, 255, 255, 0.95);
}

input[type="text"]:hover:not(:focus),
textarea:hover:not(:focus) {
    border-color: rgba(102, 126, 234, 0.4);
    transform: translateY(-1px);
}

textarea {
    resize: vertical;
    min-height: 120px;
    font-family: inherit;
    line-height: 1.6;
}

.checkbox-group {
    display: flex;
    align-items: center;
    padding: 1.25rem;
    background: linear-gradient(135deg, rgba(102, 126, 234, 0.05) 0%, rgba(240, 147, 251, 0.05) 100%);
    border: 1px solid rgba(102, 126, 234, 0.15);
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
}

.checkbox-group::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
    opacity: 0;
    transition: opacity 0.3s ease;
}

.checkbox-group:hover {
    background: linear-gradient(135deg, rgba(102, 126, 234, 0.08) 0%, rgba(240, 147, 251, 0.08) 100%);
    border-color: rgba(102, 126, 234, 0.3);
    transform: translateY(-2px);
    box-shadow: var(--shadow-light);
}

.checkbox-group:has(input:checked) {
    background: linear-gradient(135deg, var(--primary-color) 0%, var(--accent-color) 100%);
    border-color: var(--primary-color);
    color: white;
    transform: translateY(-1px);
}

.checkbox-group:has(input:checked)::before {
    opacity: 0.1;
}

input[type="checkbox"] {
    margin-right: 1rem;
    height: 1.5rem;
    width: 1.5rem;
    accent-color: var(--accent-color);
    cursor: pointer;
    position: relative;
    z-index: 1;
}

.checkbox-group label {
    margin: 0;
    font-weight: 500;
    cursor: pointer;
    line-height: 1.5;
    position: relative;
    z-index: 1;
}

button[type="submit"] {
    width: 100%;
    padding: 1.25rem 2rem;
    background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
    color: white;
    border: none;
    border-radius: 16px;
    font-size: 1.1rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
    box-shadow: var(--shadow-medium);
    letter-spacing: -0.01em;
}

button[type="submit"]::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
    transition: left 0.6s;
}

button[type="submit"]:hover:not(:disabled) {
    background: linear-gradient(135deg, var(--primary-hover) 0%, var(--secondary-color) 100%);
    transform: translateY(-3px);
    box-shadow: var(--shadow-heavy);
}

button[type="submit"]:hover:not(:disabled)::before {
    left: 100%;
}

button[type="submit"]:active:not(:disabled) {
    transform: translateY(-1px);
}

button[type="submit"]:disabled {
    background: linear-gradient(135deg, #94a3b8 0%, #cbd5e1 100%);
    cursor: not-allowed;
    transform: none;
    box-shadow: var(--shadow-light);
}

.suggestions {
    list-style-type: none;
    padding: 0;
    margin: 8px 0 0;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(102, 126, 234, 0.2);
    border-radius: 16px;
    position: absolute;
    width: 100%;
    z-index: 10;
    max-height: 200px;
    overflow-y: auto;
    box-shadow: var(--shadow-medium);
    animation: slideDown 0.3s ease-out;
}

@keyframes slideDown {
    from {
        opacity: 0;
        transform: translateY(-10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.suggestions li {
    padding: 1rem 1.25rem;
    cursor: pointer;
    transition: all 0.2s ease;
    border-bottom: 1px solid rgba(102, 126, 234, 0.1);
}

.suggestions li:last-child {
    border-bottom: none;
}

.suggestions li:hover {
    background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(240, 147, 251, 0.1) 100%);
    color: var(--primary-color);
    font-weight: 500;
}

.date-options {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 1.25rem;
    margin-top: 1rem;
}

.date-option-card {
    background: var(--input-background);
    backdrop-filter: blur(10px);
    border: 2px solid rgba(102, 126, 234, 0.2);
    border-radius: 20px;
    padding: 1.5rem 1rem;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    user-select: none;
    position: relative;
    overflow: hidden;
    box-shadow: var(--shadow-light);
}

.date-option-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
    opacity: 0;
    transition: opacity 0.3s ease;
}

.date-option-card:hover {
    transform: translateY(-6px) scale(1.02);
    box-shadow: var(--shadow-medium);
    border-color: rgba(102, 126, 234, 0.4);
}

.date-option-card.selected {
    background: linear-gradient(135deg, var(--primary-color) 0%, var(--accent-color) 100%);
    border-color: var(--primary-color);
    color: white;
    font-weight: 600;
    transform: translateY(-3px) scale(1.05);
    box-shadow: var(--shadow-heavy);
}

.date-option-card.selected::before {
    opacity: 0.1;
}

.date-month-day {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    position: relative;
    z-index: 1;
}

.date-month-day span {
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: -0.02em;
}

.icon {
    width: 2rem;
    height: 2rem;
    opacity: 0.7;
    color: var(--primary-color);
    transition: all 0.3s ease;
}

.date-option-card.selected .icon {
    color: white;
    opacity: 1;
}

.date-week {
    font-size: 1rem;
    margin-top: 0.5rem;
    opacity: 0.8;
    position: relative;
    z-index: 1;
    font-weight: 500;
}

/* スクロールバーカスタマイズ */
.suggestions::-webkit-scrollbar {
    width: 6px;
}

.suggestions::-webkit-scrollbar-track {
    background: rgba(102, 126, 234, 0.1);
    border-radius: 3px;
}

.suggestions::-webkit-scrollbar-thumb {
    background: var(--primary-color);
    border-radius: 3px;
}

/* レスポンシブデザイン */
@media (max-width: 768px) {
    .container {
        padding: 2rem 1.5rem;
        margin: 1rem;
    }

    h1 {
        font-size: 1.75rem;
        margin-bottom: 2.5rem;
    }

    .date-options {
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));

    }

    .date-option-card {
        padding: 1.25rem 0.75rem;
    }

    .date-month-day span {
        font-size: 1.5rem;
    }
}

    body {
        padding: 1rem 0.5rem;

        padding: 1.5rem 1rem;
